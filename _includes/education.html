<section id="education" class="resume" aria-labelledby="education-title">

    <div class="section-header">
        <h2 id="education-title">Education</h2>

    </div>

    <div class="row">
        {% for education in site.data.education %}
        <div class="col-md-12 col-sm-12 col-xs-12">
            <article class="{% if forloop.index == 1 %}top-item {% endif %}resume-item p-education h-event">
                <h3 class="p-name">{{ education.title }}</h3>
                <span>
                    <time class="dt-start" datetime="{{ education.start_date | date: '%Y-%m' }}">{{ education.start_date | date: "%B %Y" }}</time>
                    -
                    <time class="dt-end" datetime="{{ education.end_date | date: '%Y-%m' }}">{{ education.end_date | date: "%B %Y" }}</time>
                </span>
                <p class="p-location">{{ education.school }} | {{ education.location }}</p>
            </article>
        </div>
        {% endfor %}
    </div>

</section>
