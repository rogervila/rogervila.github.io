summary: >-
  Software architect with **13 years of professional experience**. Architected a 10+ service,
  event-driven platform on Kubernetes for **HP**, and now modernise legacy Java and PHP SaaS APIs on
  **AWS and Cloudflare** at InfoPro Digital Automotive. Builds secure REST APIs and event-driven
  integrations (Apache Pulsar, AWS SQS), implements observability (Grafana, Datadog, ELK Stack) and
  manages incident response. Former **founder** of a web development company and **startup tech lead**
  who took a restaurant product from scratch to an MVP launched for investors.

# Long profile rendered in the "About Me" section of the website (one HTML paragraph per item).
profile:
  - >-
    Software architect with 13 years of professional experience. I design and build backend systems on
    <strong>AWS</strong> and <strong>Cloudflare</strong>, <strong>event-driven architectures</strong> and
    <strong>secure REST APIs</strong>, and I modernise legacy Java and PHP platforms.
  - >-
    As a consultant at <strong>HP</strong> (through K-LAGAN), I architected and operated a platform of
    10+ containerised microservices on <strong>Kubernetes</strong>, integrated through Apache Pulsar,
    AWS SQS and Redis Pub/Sub, and led remote engineering teams across Europe and Asia. At
    <strong>InfoPro Digital Automotive</strong>, I modernise legacy Java and PHP SaaS APIs and manage
    incident response for the platform.
  - >-
    I run production systems with <strong>observability</strong> (Grafana, Datadog, ELK Stack), CI/CD
    quality checks (Jenkins, SonarQube), structured postmortems and man-day budgets for technical maintenance. At InfoPro Digital Automotive, systematic refactoring,
    stronger test coverage and safer deployments reduced production incidents by 20%.
  - >-
    I also have founder and startup experience. I founded and ran <strong>SeeDoCare</strong>, a web
    development company, in parallel with my employed roles. As <strong>Tech Lead at Wivapp</strong>,
    I took a new restaurant product from scratch to an MVP launched for investors.
  - >-
    I maintain <strong>open-source software</strong>:
    <a rel="noopener noreferrer" target="_blank" href="https://equipment-python.vercel.app">Equipment</a>,
    a Python scaffolding framework used in production environments, PHP and Python packages published on
    Packagist and PyPI, and a collection of
    <a rel="noopener noreferrer" target="_blank" href="https://github.com/rogervila/agent-skills">AI agent skills</a>
    that automate engineering workflows.

